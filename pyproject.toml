[project]
name = "supportops-ai"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.8,<3",
 "httpx>=0.28,<0.29", "beautifulsoup4>=4.13,<5", "markdownify>=1.1,<2",
 "chromadb>=1.3,<2", "sentence-transformers>=5.1,<6", "langchain-core>=1,<2",
 "streamlit>=1.45,<2", "pypdf>=6,<7", "transformers>=4.48,<5", "torch>=2.5,<3"
]
[dependency-groups]
ui = ["streamlit", "httpx"]
dev = ["pytest>=8,<10","ruff>=0.12,<1"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4","E7","E9","F","I","B"]
ignore = ["B008"]
